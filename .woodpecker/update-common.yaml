variables:
    - &cron_name "update.common"
    - &flakedir "flakes/common"
    - &message "[ci] Update flakes/common"

when:
    - event: cron
      cron: *cron_name
    - event: manual

clone:
    git:
        image: woodpeckerci/plugin-git

steps:
    - name: Update & Check
      image: docker.io/nixos/nix:2.34.7
      directory: *flakedir
      commands:
        - nix-env -iA nixpkgs.diffutils
        - mkdir -p /tmp/updater
        - cp flake.lock /tmp/updater/flake.lock
        - nix --extra-experimental-features "nix-command flakes" flake update
        - nix --extra-experimental-features "nix-command flakes" flake check
        - echo $(diff /tmp/updater/flake.lock flake.lock) > ./auto-update.diff
    - name: Commit & Push Changes
      image: appleboy/drone-git-push
      settings:
          branch: main
          remote: git@github.com:dax-dot-gay/lesbos.nix.git
          force: false
          commit: true
          commit_message: *message
          ssh_key:
              from_secret: deploy-ssh
